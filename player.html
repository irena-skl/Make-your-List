<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Make your List">
<title data-i18n="player.title">循环播放设置</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="page">
  <header class="page-header">
    <a class="back-link" id="back-link" href="index.html" data-i18n-attr="aria-label:player.backAria,title:player.backAria">
      <svg class="back-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1 data-i18n="app.title">Make your List</h1>
    <p class="subtitle" id="video-title" hidden></p>
    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-btn" type="button" data-lang-btn="ja">日本語</button>
      <button class="lang-btn" type="button" data-lang-btn="en">English</button>
      <button class="lang-btn" type="button" data-lang-btn="zh">中文</button>
    </div>
  </header>

  <section class="card stage-card">
    <div class="stage" id="stage">
      <img id="cover" class="cover" alt="视频封面">
    </div>

    <div class="controls">
      <div class="fields">
        <div class="field field-videos">
          <span class="field-label" data-i18n="player.durationLabel">每个视频观看时长（秒）· 可单独勾选全部播放</span>
          <div class="video-rows" id="video-rows"></div>
        </div>
        <div class="field field-count">
          <label for="count" data-i18n="player.countLabel">整体观看次数（轮数）</label>
          <input id="count" type="number" min="1" max="999" step="1" value="10">
          <p class="hint rounds-hint" data-i18n="player.roundsHint">按列表顺序播放完所有视频记为 1 轮</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="start-btn" type="button" data-i18n="player.startBtn">开始播放</button>
        <button class="btn danger" id="stop-btn" type="button" hidden data-i18n="player.stopBtn">停止</button>
      </div>
      <div class="progress">
        <div class="progress-head">
          <span id="status-text">等待开始</span>
          <span id="round-text" class="round-text"></span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>
  </section>

  <section class="card log-card">
    <h2 data-i18n="player.logTitle">播放日志</h2>
    <ul class="log-list" id="log-list"></ul>
  </section>

  <footer class="page-footer">
    <p class="footer-note" data-i18n="footer.note">本网站仅供娱乐，不得进行违法商业活动。</p>
    <p class="footer-star" data-i18n="footer.star">如果喜欢的话可以给我的 <a class="gh-link" href="https://github.com/irena-skl/Make-your-List" target="_blank" rel="noopener"><img class="gh-logo" src="assets/github.svg" alt="GitHub"></a> 点个星。</p>
  </footer>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/parse.js"></script>
<script src="assets/player.js"></script>
</body>
</html>
